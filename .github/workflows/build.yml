name: Build OpenDojo DLL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Project
        shell: pwsh
        run: |
          if (Test-Path "CMakeLists.txt") {
            cmake -B build -A x64
            cmake --build build --config Release
          } else {
            $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
            if ($sln) {
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64
            } else {
              Write-Error "File CMakeLists.txt atau .sln tidak ditemukan."
              exit 1
            }
          }

      - name: Rename DLL to dinput8.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dll = Get-ChildItem -Path . -Include "dinput8.dll","*opendojo*.dll" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path . -Filter "*.dll" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          }
          if ($dll) {
            Copy-Item $dll.FullName -Destination "dist\dinput8.dll" -Force
            Write-Host "Berhasil rename $($dll.Name) menjadi dist\dinput8.dll"
          } else {
            Write-Error "File DLL hasil build tidak ditemukan."
            exit 1
          }

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendojo-dinput8
          path: dist/dinput8.dll
