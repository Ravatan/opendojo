name: Build OpenDojo DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B dll/build -S dll -A x64
          -DOPENDOJO_PREVIEW_UPDATE=OFF
          -DOPENDOJO_CLOUD_URL=""
          -DOPENDOJO_CLOUD_PROXY_KEY=""

      - name: Build (Release)
        run: cmake --build dll/build --config Release

      - name: Upload dinput8.dll
        uses: actions/upload-artifact@v4
        with:
          name: opendojo-dinput8
          path: dll/build/Release/dinput8.dll
